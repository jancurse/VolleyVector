name: Migrate Production Database

# Apply migrations to production only after CI is green on main, mirroring deploy.yml's gating. The
# deliberate act is merging the PR after seeing the Migration Guard warning; there is no separate approval
# button (GitHub Environments required reviewers are unavailable on a private free repo). A manual run
# (workflow_dispatch) pushes the default branch on demand.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never interrupt a push that is mid-flight: queue runs rather than cancelling them.
concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Push migrations to production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The access token authenticates the CLI; the database password authorizes the push. Both are repo
      # secrets (see docs/development.md). The project ref is public (it is in the committed .env URL).
      - name: Link to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref xobsdirytehneeofjmrq

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push
