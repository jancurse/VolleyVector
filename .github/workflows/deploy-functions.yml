name: Deploy Edge Functions

# Deploy Supabase Edge Functions to production only after CI is green on main, mirroring migrate-prod.yml's
# gating. Functions reach production only by this deliberate, CI-gated deploy on merge, never from a dev
# session. The deliberate act is merging the PR after seeing the Migration Guard warning; there is no separate
# approval button (GitHub Environments required reviewers are unavailable on a private free repo). A manual run
# (workflow_dispatch) deploys the default branch on demand.
#
# Every green-main run deploys all functions, exactly as migrate-prod.yml always pushes. We do not detect which
# functions changed: a per-commit diff misses a change made in an earlier commit of a rebase-merged PR, so that
# function would silently never deploy. Re-uploading an unchanged function is an idempotent no-op.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never interrupt a deploy mid-flight: queue runs rather than cancelling them.
concurrency:
  group: deploy-functions-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-functions:
    name: Deploy edge functions to production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The access token authenticates the CLI; a function deploy needs no database password. The project ref
      # is public (it is in the committed .env URL). Verify JWT stays off: each function authorizes its caller
      # in code (see the supabase skill), matching the manual deploys this replaces. Each function is retried
      # against a transient failure (e.g. an esm.sh timeout), and every function is attempted even if another
      # fails, so one flake cannot leave production half-deployed; the job fails at the end if any never deployed.
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          failed=()
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            deployed=false
            for attempt in 1 2 3 4; do
              echo "Deploying $name (attempt $attempt/4)"
              if npx supabase functions deploy "$name" --no-verify-jwt --project-ref xobsdirytehneeofjmrq; then
                deployed=true
                break
              fi
              if [ "$attempt" -lt 4 ]; then
                backoff=$((2 ** attempt))
                echo "Deploy of $name failed; retrying in ${backoff}s"
                sleep "$backoff"
              fi
            done
            if [ "$deployed" = false ]; then
              echo "::error::Failed to deploy $name after 4 attempts"
              failed+=("$name")
            fi
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Edge function deploy failed for: ${failed[*]}"
            exit 1
          fi
          echo "All edge functions deployed successfully."
