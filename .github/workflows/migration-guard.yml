name: Migration Guard

# Flags a PR that adds or changes Supabase migrations (supabase/migrations/) or edge functions
# (supabase/functions/), surfacing the change for review before merge: it adds a label and posts one comment
# naming what changed. These define production state and are hard to roll back, unlike a front-end change.
# The database-migration and edge-function labels are pre-created in the repo. Same-repo PRs only — the default
# token can attach a label and comment via the REST API (gh api needs no checkout, unlike the gh pr subcommands).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  flag-migrations:
    name: Flag migration changes
    runs-on: ubuntu-latest
    steps:
      - name: Detect and flag migration or edge-function changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          migrations=$(echo "$files" | grep '^supabase/migrations/' || true)
          functions=$(echo "$files" | grep '^supabase/functions/' || true)

          if [ -z "$migrations" ] && [ -z "$functions" ]; then
            echo "No migration or edge-function changes in this PR; nothing to flag."
            exit 0
          fi

          warnings=()
          if [ -n "$migrations" ]; then
            echo "Migration changes detected:"; echo "$migrations"
            gh api --method POST "repos/$REPO/issues/$PR/labels" -f "labels[]=database-migration" >/dev/null
            warnings+=('- :warning: **`supabase/migrations/`** — this PR adds or changes database migrations.')
          fi
          if [ -n "$functions" ]; then
            echo "Edge-function changes detected:"; echo "$functions"
            gh api --method POST "repos/$REPO/issues/$PR/labels" -f "labels[]=edge-function" >/dev/null
            warnings+=('- :warning: **`supabase/functions/`** — this PR adds or changes edge functions.')
          fi

          # Post the warning once, keyed off a hidden marker, so re-runs on new commits do not repeat it.
          if gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].body' | grep -qF "<!-- migration-guard -->"; then
            echo "Warning comment already present."
          else
            body=$(printf '%s\n' \
              '<!-- migration-guard -->' \
              ':warning: **This PR changes Supabase migrations and/or edge functions.**' \
              '' \
              "${warnings[@]}" \
              '' \
              'These define production state and are hard to roll back. Review the change above carefully before merging.')
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f "body=$body" >/dev/null
          fi
