name: PR Review

# On-demand code review. Comment "@claude-review" on a pull request and Claude
# runs the repo's code-review-custom skill, posting its findings back as a PR
# comment. The same skill runs locally, so CI and local review share one
# definition. The distinct trigger phrase leaves "@claude" free for other Claude
# workflows later.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Only spin up a runner for "@claude-review" comments on a pull request.
    if: |
      contains(github.event.comment.body, '@claude-review') &&
      (github.event_name == 'pull_request_review_comment' ||
       github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-review"
          prompt: |
            Review this pull request using the code-review-custom skill (defined
            in .claude/skills/). Follow its process and report format exactly,
            ending with its one-line verdict, and post the result as a PR comment.
