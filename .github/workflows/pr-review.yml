name: PR Review

# On-demand code review. Comment "@claude-review" on a pull request and Claude
# runs the repo's code-review-custom skill, posting its findings back as a PR
# comment. The same skill runs locally, so CI and local review share one
# definition. The distinct trigger phrase leaves "@claude" free for other Claude
# workflows later.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Only spin up a runner for "@claude-review" comments on a pull request.
    if: |
      contains(github.event.comment.body, '@claude-review') &&
      (github.event_name == 'pull_request_review_comment' ||
       github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The skill's best-effort visual check drives the Playwright MCP server,
      # which needs a Chromium and a running app. These steps stand the app up so
      # the check can run; if the dev login secret is absent the agent simply
      # hits the login gate and the skill records a skip rather than failing.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure dev auto-login
        run: |
          mkdir -p ~/.config/volleycoach
          cat > ~/.config/volleycoach/dev.env <<EOF
          VITE_DEV_EMAIL=${{ secrets.VITE_DEV_EMAIL }}
          VITE_DEV_PASSWORD=${{ secrets.VITE_DEV_PASSWORD }}
          EOF

      - name: Start dev server
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          nohup npm run dev > dev-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173 > /dev/null && exit 0; sleep 1; done
          echo "Dev server did not come up in time; visual check will be skipped." >&2

      - name: Review with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-review"
          # Post a live-updating progress comment, and stream the full run into the
          # Actions log (private repo, trusted maintainers), so a stuck or slow run
          # is diagnosable instead of opaque.
          track_progress: true
          show_full_output: true
          claude_args: |
            --mcp-config '{"mcpServers": {"playwright": {"command": "npx", "args": ["@playwright/mcp@latest", "--headless", "--isolated"]}}}'
            --allowedTools mcp__playwright__*
          prompt: |
            Review this pull request using the code-review-custom skill (defined
            in .claude/skills/). Follow its process and report format exactly,
            ending with its one-line verdict, and post the result as a PR comment.

      # Keep the structured execution log even when the review fails, times out, or
      # is canceled, so a bad run can be inspected after the runner is gone.
      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
