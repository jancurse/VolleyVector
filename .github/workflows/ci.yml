name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Format, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Lint with ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  rls:
    name: RLS Policy Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The CLI pulls from public.ecr.aws by default, whose anonymous limit is shared across GitHub's runner IPs.
      # Pulling the same images from GHCR as this repo's token avoids that limit with no extra secret.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-latest ships Docker, so the throwaway stack runs here exactly as it does locally. test:rls is
      # self-managing: it builds a fresh stack from this branch's migrations and seed, then tears it down.
      - name: Run RLS policy tests
        run: npm run test:rls
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

  migrations:
    name: Migration Ordering
    runs-on: ubuntu-latest
    # A PR-only guard: migrate-prod.yml applies migrations by timestamp order, so a migration the PR adds
    # must be later than any already on main. A push or manual run has no base branch to compare against.
    if: github.event_name == 'pull_request'

    steps:
      # fetch-depth: 0 so origin/main is present to compare the PR's added migrations against.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Node 24 runs the .ts script directly via built-in type stripping; no install or build step needed.
      - name: Check migration ordering
        run: node scripts/check-migration-order.ts
