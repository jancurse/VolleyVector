<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="VolleyCoach">
  <!-- Minimal cut tuned for the 16px favicon: no front-zone band, heavier strokes so the court holds. -->
  <rect width="100" height="100" rx="22" fill="#2f6fe0" />
  <rect x="20" y="20" width="60" height="60" rx="5" fill="none" stroke="#ffffff" stroke-width="3.4" />
  <line x1="20" y1="40" x2="80" y2="40" stroke="#ffffff" stroke-width="2.6" stroke-opacity="0.9" />
  <g transform="translate(80 20)">
    <circle r="11" fill="#2f6fe0" />
    <circle r="9" fill="#FFC61E" />
  </g>
</svg>
