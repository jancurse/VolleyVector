<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="VolleyCoach">
  <!-- Editable source for og-image.png (the 1200x630 link-preview card). The brand lockup centred on the
       warm charcoal field: the court mark + amber ball, with "VolleyCoach" in Bricolage Grotesque. The card
       is a themeless brand surface, so it takes the warm expression (the app defaults to dark).
       Re-export to PNG with a headless browser (the font loads from Google Fonts). See docs/brand.md. -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&amp;display=swap");
    .word {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 800;
      font-size: 132px;
      letter-spacing: -0.035em;
      fill: #f3efe6;
    }
  </style>
  <defs>
    <radialGradient id="field-glow" cx="50%" cy="-8%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ball-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#22201c" />
  <rect width="1200" height="630" fill="url(#field-glow)" />

  <!-- mark: the court, tightly framed, in the warm court colour with the amber ball over the corner -->
  <svg x="121" y="239" width="152" height="152" viewBox="20 14 66 66">
    <rect x="23" y="23" width="54" height="18" fill="#f3efe6" fill-opacity="0.14" />
    <rect x="23" y="23" width="54" height="54" rx="5" fill="none" stroke="#f3efe6" stroke-width="2.6" />
    <line x1="23" y1="41" x2="77" y2="41" stroke="#f3efe6" stroke-width="1.8" stroke-opacity="0.9" />
    <g transform="translate(77 23)">
      <circle r="7.5" fill="#22201c" />
      <circle r="6.2" fill="#e8973a" />
      <circle r="6.2" fill="url(#ball-sheen)" />
    </g>
  </svg>

  <text x="323" y="315" class="word" dominant-baseline="central">VolleyCoach</text>
</svg>
