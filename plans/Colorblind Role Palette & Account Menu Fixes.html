document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"dd17b5b0-f82a-4467-8cb0-5cf67a2cc908\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5ade860b-f909-4cd0-8356-cb26626af7d5\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"78b5af2e-fede-425a-b92c-c0c376b8925b\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6d542a84-021c-43c8-92df-d287275c0023\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"65903aa5-01c8-47d8-8e9f-2c49d61444e5\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6ff5f42f-28cd-4ab5-acc2-56df6a4c42b9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dd17b5b0-f82a-4467-8cb0-5cf67a2cc908\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    body { margin: 0; background: #c9c5bc; }\n    @media print { body { background: #fff; } .doc-page { box-shadow: none !important; margin: 0 !important; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"doc-page\" style=\"font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #1d2129; background: #faf8f2; max-width: 880px; margin: 40px auto; padding: 72px clamp(40px, 7vw, 84px) 96px; box-shadow: 0 24px 60px -28px rgba(46,44,62,0.4); line-height: 1.6;\">\n\n  <!-- MASTHEAD -->\n  <div style=\"display: flex; flex-direction: column; gap: 16px; border-bottom: 2px solid #1d2129; padding-bottom: 28px;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.28em; color: #8a7d62;\">VOLLEYCOACH DESIGN SPEC · BRANCH 23-DESIGN-UPDATE<\u002Fdiv>\n    <h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.04;\">The role palette, and two small fixes<\u002Fh1>\n    <p style=\"margin: 0; font-size: 17px; color: #4a5260; max-width: 64ch;\">Two changes specified for implementation. The first change rebuilds the marker role palette so it survives colour-blindness and stops colliding with the app’s error colour. The second is a pair of small fixes: a button-height mismatch and the dingy light-mode menu surface. Every value below is checked against the real code on the branch named above.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- AT A GLANCE -->\n  <div style=\"display: flex; gap: 0; margin-top: 36px; border: 1px solid rgba(20,24,32,0.14); border-radius: 14px; overflow: hidden;\">\n    <div style=\"flex: 1; padding: 20px 24px; border-right: 1px solid rgba(20,24,32,0.12);\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #8a7d62; font-weight: 600;\">PART ONE<\u002Fdiv>\n      <div style=\"font-size: 15px; font-weight: 600; margin-top: 4px;\">Role palette — medium effort<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; padding: 20px 24px; border-right: 1px solid rgba(20,24,32,0.12);\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #8a7d62; font-weight: 600;\">PART TWO<\u002Fdiv>\n      <div style=\"font-size: 15px; font-weight: 600; margin-top: 4px;\">Two detail fixes — low effort<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; padding: 20px 24px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #8a7d62; font-weight: 600;\">SCOPE<\u002Fdiv>\n      <div style=\"font-size: 15px; font-weight: 600; margin-top: 4px;\">Tokens only — no new UI<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CORRECTION CALLOUT -->\n  <div style=\"display: flex; gap: 18px; margin-top: 32px; background: #f4ede0; border: 1px solid rgba(154,69,51,0.28); border-left: 4px solid #9a4533; border-radius: 12px; padding: 22px 26px;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: #9a4533; flex: 0 0 auto; padding-top: 2px;\">READ FIRST<\u002Fdiv>\n    <div style=\"font-size: 14.5px; color: #3a2f28;\">\n      <strong>There is no “opponent” in this app.<\u002Fstrong> Do not add hollow “opponent” discs or any “encode team by fill vs. outline” scheme. Every marker on a board belongs to the coach’s own diagram. <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; background: rgba(20,24,32,0.06); padding: 1px 5px; border-radius: 4px;\">OPP<\u002Fcode> is the <strong>Opposite<\u002Fstrong> — a front-row hitter role — not an opposing player. So this spec is purely a <em>recolour<\u002Fem> of the existing role set. No new marker types, no hollow/dashed variants, no fill-vs-outline team encoding.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============================================================= -->\n  <!-- ITEM 02 -->\n  <!-- ============================================================= -->\n  <div style=\"margin-top: 60px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.24em; color: #2e7d4f;\">PART ONE<\u002Fdiv>\n  <h2 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.025em; margin: 8px 0 6px; line-height: 1.05;\">A colour-blind-safe role palette<\u002Fh2>\n  <p style=\"margin: 0 0 8px; color: #4a5260; font-size: 15.5px; max-width: 64ch;\">The marker palette lives in <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; background: rgba(20,24,32,0.06); padding: 1px 5px; border-radius: 4px;\">src/court/roles.ts<\u002Fcode> and is deliberately theme-independent — a blue Outside hitter is blue in both light and dark mode. We keep that principle. We only change the colour values.<\u002Fp>\n\n  <!-- TODAY -->\n  <h3 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; margin: 40px 0 14px;\">The palette today<\u002Fh3>\n  <div style=\"background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 14px; padding: 26px 30px;\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 26px;\">\n      <!-- current swatches -->\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px;\"><div style=\"width: 48px; height: 48px; border-radius: 50%; background: #C77A18; border: 2.5px solid #9A5B10; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #fff;\">S<\u002Fdiv><span style=\"font-size: 12px; color: #4a5260; font-weight: 600;\">Setter<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8a7d62;\">#C77A18<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px;\"><div style=\"width: 48px; height: 48px; border-radius: 50%; background: #2F6FE0; border: 2.5px solid #1C4FAE; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #fff;\">OH<\u002Fdiv><span style=\"font-size: 12px; color: #4a5260; font-weight: 600;\">Outside<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8a7d62;\">#2F6FE0<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px;\"><div style=\"width: 48px; height: 48px; border-radius: 50%; background: #16A085; border: 2.5px solid #0E7A64; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #fff;\">MB<\u002Fdiv><span style=\"font-size: 12px; color: #4a5260; font-weight: 600;\">Middle<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8a7d62;\">#16A085<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px;\"><div style=\"width: 48px; height: 48px; border-radius: 50%; background: #E0533B; border: 2.5px solid #B23A26; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #fff;\">OPP<\u002Fdiv><span style=\"font-size: 12px; color: #4a5260; font-weight: 600;\">Opposite<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8a7d62;\">#E0533B<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px;\"><div style=\"width: 48px; height: 48px; border-radius: 50%; background: #8B5CF6; border: 2.5px solid #6B3FD0; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #fff;\">L<\u002Fdiv><span style=\"font-size: 12px; color: #4a5260; font-weight: 600;\">Libero<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8a7d62;\">#8B5CF6<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- WHAT'S WRONG -->\n  <h3 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; margin: 40px 0 14px;\">Three things wrong with it<\u002Fh3>\n  <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n    <div style=\"display: flex; gap: 14px; background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 20px 24px;\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #9a4533; flex: 0 0 18px; font-size: 15px;\">A<\u002Fspan>\n      <div style=\"font-size: 14.5px;\"><strong>It pairs red with green.<\u002Fstrong> Middle (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">#16A085<\u002Fcode> green) and Opposite (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">#E0533B<\u002Fcode> red) are both front-row roles — they routinely sit side by side at the net. Roughly 1 in 12 men can’t reliably tell red from green; to them these two discs become the same colour, and the only thing left to separate them is the small label.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 14px; background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 20px 24px;\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #9a4533; flex: 0 0 18px; font-size: 15px;\">B<\u002Fspan>\n      <div style=\"font-size: 14.5px;\"><strong>The Opposite red is the app’s error colour.<\u002Fstrong> Opposite (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">#E0533B<\u002Fcode>) sits almost exactly on the danger token (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">--danger<\u002Fcode> = <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">#d6442b<\u002Fcode> light / <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">#ef6a52<\u002Fcode> dark) — same hue family, used for delete buttons, validation errors, and the “Delete account” item. A player’s identity colour should never read as “something is wrong here.”<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 14px; background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 20px 24px;\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #9a4533; flex: 0 0 18px; font-size: 15px;\">C<\u002Fspan>\n      <div style=\"font-size: 14.5px;\"><strong>The discs aren’t at matched lightness.<\u002Fstrong> The five fills land at noticeably different perceptual lightness, so on the court some roles “pop” and others recede — an accidental hierarchy where there should be none. All five players are equal citizens on the diagram.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin: 22px 0 0; color: #4a5260; font-size: 14px;\"><strong style=\"color:#1d2129;\">Also affected:<\u002Fstrong> the basic-mode recolour palette (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">MARKER_COLORS<\u002Fcode>) repeats the same explicit <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">red<\u002Fcode> and <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">green<\u002Fcode> — see the recolour fix below.<\u002Fp>\n\n  <!-- WHERE IT BITES -->\n  <div style=\"margin-top: 26px; background: #f4ede0; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 20px 26px;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #8a7d62;\">WHERE COLOUR IS THE ONLY CUE<\u002Fdiv>\n    <p style=\"margin: 8px 0 0; font-size: 14px; color: #3a2f28;\">On the full court each disc carries a white label (S, OH, MB…), so colour is a fast secondary cue. But in <strong>board thumbnails the labels are dropped<\u002Fstrong> (compact mode) — there, colour is the <em>only<\u002Fem> way to tell roles apart. The palette therefore has to do the work unaided. This is the case to verify hardest.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- THE FIX -->\n  <h3 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; margin: 44px 0 6px;\">The proposed palette<\u002Fh3>\n  <p style=\"margin: 0 0 18px; color: #4a5260; font-size: 15px; max-width: 64ch;\">Rebuilt in OKLCH so lightness is held roughly constant (band <strong>0.56–0.66 L<\u002Fstrong>) while hue does the separating. No pure red, no pure green; the warm slot is gold (the Setter, who touches every ball), the rest spread across teal → blue → violet → magenta. Nothing sits near the danger hue (~30°).<\u002Fp>\n\n  <div style=\"background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 14px; padding: 28px 30px;\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-start;\">\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; width: 132px;\"><div style=\"width: 52px; height: 52px; border-radius: 50%; background: oklch(0.64 0.13 72); border: 2.5px solid oklch(0.50 0.12 68); display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #fff;\">S<\u002Fdiv><span style=\"font-size: 12.5px; color: #1d2129; font-weight: 700;\">Setter<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #8a7d62; text-align: center;\">oklch(.64 .13 72)<br>gold<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; width: 132px;\"><div style=\"width: 52px; height: 52px; border-radius: 50%; background: oklch(0.58 0.14 258); border: 2.5px solid oklch(0.45 0.13 260); display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #fff;\">OH<\u002Fdiv><span style=\"font-size: 12.5px; color: #1d2129; font-weight: 700;\">Outside<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #8a7d62; text-align: center;\">oklch(.58 .14 258)<br>blue<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; width: 132px;\"><div style=\"width: 52px; height: 52px; border-radius: 50%; background: oklch(0.66 0.11 188); border: 2.5px solid oklch(0.51 0.10 190); display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #fff;\">MB<\u002Fdiv><span style=\"font-size: 12.5px; color: #1d2129; font-weight: 700;\">Middle<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #8a7d62; text-align: center;\">oklch(.66 .11 188)<br>teal<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; width: 132px;\"><div style=\"width: 52px; height: 52px; border-radius: 50%; background: oklch(0.61 0.15 350); border: 2.5px solid oklch(0.47 0.14 352); display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #fff;\">OPP<\u002Fdiv><span style=\"font-size: 12.5px; color: #1d2129; font-weight: 700;\">Opposite<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #8a7d62; text-align: center;\">oklch(.61 .15 350)<br>magenta<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; width: 132px;\"><div style=\"width: 52px; height: 52px; border-radius: 50%; background: oklch(0.56 0.14 300); border: 2.5px solid oklch(0.44 0.13 300); display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #fff;\">L<\u002Fdiv><span style=\"font-size: 12.5px; color: #1d2129; font-weight: 700;\">Libero<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #8a7d62; text-align: center;\">oklch(.56 .14 300)<br>violet<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"height: 1px; background: rgba(20,24,32,0.1); margin: 26px 0;\"><\u002Fdiv>\n\n    <!-- value table -->\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #1d2129;\">\n      <div style=\"display: grid; grid-template-columns: 1.4fr 1.6fr 1.6fr 0.8fr; gap: 8px 18px; align-items: center;\">\n        <div style=\"font-weight: 700; letter-spacing: 0.1em; color: #8a7d62; font-size: 9.5px;\">ROLE<\u002Fdiv>\n        <div style=\"font-weight: 700; letter-spacing: 0.1em; color: #8a7d62; font-size: 9.5px;\">FILL<\u002Fdiv>\n        <div style=\"font-weight: 700; letter-spacing: 0.1em; color: #8a7d62; font-size: 9.5px;\">RING (DARKER SHADE)<\u002Fdiv>\n        <div style=\"font-weight: 700; letter-spacing: 0.1em; color: #8a7d62; font-size: 9.5px;\">LABEL<\u002Fdiv>\n        <div style=\"grid-column: 1 / -1; height: 1px; background: rgba(20,24,32,0.08);\"><\u002Fdiv>\n        <div>Setter<\u002Fdiv><div>oklch(0.64 0.13 72)<\u002Fdiv><div>oklch(0.50 0.12 68)<\u002Fdiv><div>#FFFFFF<\u002Fdiv>\n        <div>Outside<\u002Fdiv><div>oklch(0.58 0.14 258)<\u002Fdiv><div>oklch(0.45 0.13 260)<\u002Fdiv><div>#FFFFFF<\u002Fdiv>\n        <div>Middle<\u002Fdiv><div>oklch(0.66 0.11 188)<\u002Fdiv><div>oklch(0.51 0.10 190)<\u002Fdiv><div>#FFFFFF<\u002Fdiv>\n        <div>Opposite<\u002Fdiv><div>oklch(0.61 0.15 350)<\u002Fdiv><div>oklch(0.47 0.14 352)<\u002Fdiv><div>#FFFFFF<\u002Fdiv>\n        <div>Libero<\u002Fdiv><div>oklch(0.56 0.14 300)<\u002Fdiv><div>oklch(0.44 0.13 300)<\u002Fdiv><div>#FFFFFF<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin: 18px 0 0; color: #4a5260; font-size: 13.5px;\"><strong style=\"color:#1d2129;\">Keep everything else.<\u002Fstrong> Each role still has a fill, a ring (a darker shade of the fill, ~0.14 L below it), and a white label. The marker’s sheen gradient, the light rim on the dark court (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">--marker-edge<\u002Fcode>), and the drop shadow are unchanged. Don’t touch the ball — it stays the blue/yellow Mikasa artwork. Don’t touch the neutral <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">coach<\u002Fcode> slate.<\u002Fp>\n\n  <!-- COLORBLIND CHECK -->\n  <h3 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; margin: 44px 0 14px;\">The net check: Middle next to Opposite<\u002Fh3>\n  <div style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch;\">\n    <div style=\"flex: 1; min-width: 280px; background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 22px 26px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.18em; color: #9a4533;\">TODAY · RED + GREEN<\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 16px; margin-top: 14px;\">\n        <div style=\"display: flex;\">\n          <div style=\"width: 40px; height: 40px; border-radius: 50%; background: #16A085; border: 2px solid #0E7A64; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #fff; z-index: 1;\">MB<\u002Fdiv>\n          <div style=\"width: 40px; height: 40px; border-radius: 50%; background: #E0533B; border: 2px solid #B23A26; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; color: #fff; margin-left: -8px;\">OPP<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size: 13px; color: #8a7d62;\">→<\u002Fspan>\n        <div style=\"display: flex;\">\n          <div style=\"width: 40px; height: 40px; border-radius: 50%; background: #998f4f; border: 2px solid #756c38; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #fff; z-index: 1;\">MB<\u002Fdiv>\n          <div style=\"width: 40px; height: 40px; border-radius: 50%; background: #8f8047; border: 2px solid #6b5f30; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; color: #fff; margin-left: -8px;\">OPP<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 14px 0 0; font-size: 12.5px; color: #9a4533; line-height: 1.45;\">Under red-green colour-blindness the two collapse to nearly the same muddy ochre — only the label survives.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1; min-width: 280px; background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 22px 26px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.18em; color: #2e7d4f;\">PROPOSED · TEAL + MAGENTA<\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 16px; margin-top: 14px;\">\n        <div style=\"display: flex;\">\n          <div style=\"width: 40px; height: 40px; border-radius: 50%; background: oklch(0.66 0.11 188); border: 2px solid oklch(0.51 0.10 190); display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #fff; z-index: 1;\">MB<\u002Fdiv>\n          <div style=\"width: 40px; height: 40px; border-radius: 50%; background: oklch(0.61 0.15 350); border: 2px solid oklch(0.47 0.14 352); display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; color: #fff; margin-left: -8px;\">OPP<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size: 13px; color: #8a7d62;\">→<\u002Fspan>\n        <div style=\"display: flex;\">\n          <div style=\"width: 40px; height: 40px; border-radius: 50%; background: #7d96a0; border: 2px solid #5f7680; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #fff; z-index: 1;\">MB<\u002Fdiv>\n          <div style=\"width: 40px; height: 40px; border-radius: 50%; background: #9a7e93; border: 2px solid #765d70; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; color: #fff; margin-left: -8px;\">OPP<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 14px 0 0; font-size: 12.5px; color: #2e7d4f; line-height: 1.45;\">Teal keeps a cool cast, magenta keeps a warm-pink cast — they stay two different colours even when red-green vision is gone.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: 14px 0 0; font-size: 11px; color: #97917f;\">Right-hand chips are a hand-approximated deuteranopia simulation, for direction only. Implementer must verify the final values with a real simulator (e.g. Sim Daltonism, or Chrome DevTools → Rendering → Emulate vision deficiencies) across all three types — protan, deutan, tritan — <strong>including the unlabeled thumbnail case<\u002Fstrong>.<\u002Fp>\n\n  <!-- RECOLOR PALETTE -->\n  <h3 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; margin: 44px 0 6px;\">The basic-mode recolour palette<\u002Fh3>\n  <p style=\"margin: 0 0 18px; color: #4a5260; font-size: 15px; max-width: 64ch;\">In basic mode a coach can recolour a marker (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px;\">MARKER_COLORS<\u002Fcode>) — e.g. to split a drill into two teams. It currently offers literal <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">red<\u002Fcode> and <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">green<\u002Fcode>, the same bad pair. Retune it to the role hues and <strong>order it so the first two swatches are the maximally distinct pair<\u002Fstrong> (blue then gold) — the natural Team A / Team B picks.<\u002Fp>\n  <div style=\"background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 14px; padding: 26px 30px; display: flex; flex-wrap: wrap; gap: 22px;\">\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 7px;\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: oklch(0.58 0.14 258); border: 2.5px solid oklch(0.45 0.13 260);\"><\u002Fdiv><span style=\"font-size: 11.5px; color: #4a5260; font-weight: 600;\">Blue<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 7px;\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: oklch(0.66 0.12 72); border: 2.5px solid oklch(0.52 0.11 68);\"><\u002Fdiv><span style=\"font-size: 11.5px; color: #4a5260; font-weight: 600;\">Amber<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 7px;\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: oklch(0.66 0.11 188); border: 2.5px solid oklch(0.51 0.10 190);\"><\u002Fdiv><span style=\"font-size: 11.5px; color: #4a5260; font-weight: 600;\">Teal<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 7px;\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: oklch(0.61 0.15 350); border: 2.5px solid oklch(0.47 0.14 352);\"><\u002Fdiv><span style=\"font-size: 11.5px; color: #4a5260; font-weight: 600;\">Magenta<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 7px;\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: oklch(0.56 0.14 300); border: 2.5px solid oklch(0.44 0.13 300);\"><\u002Fdiv><span style=\"font-size: 11.5px; color: #4a5260; font-weight: 600;\">Violet<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 7px;\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: oklch(0.52 0.02 250); border: 2.5px solid oklch(0.40 0.02 250);\"><\u002Fdiv><span style=\"font-size: 11.5px; color: #4a5260; font-weight: 600;\">Slate<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: 14px 0 0; color: #4a5260; font-size: 13px;\">Map the role defaults onto these keys so a recoloured marker can still be reset to its role colour (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">player<\u002Fcode>→Blue, <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">coach<\u002Fcode>→Slate), exactly as today.<\u002Fp>\n\n  <!-- ACCEPTANCE -->\n  <div style=\"margin-top: 32px; background: #eef3ee; border: 1px solid rgba(46,125,79,0.3); border-radius: 12px; padding: 22px 28px;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #2e7d4f;\">PART ONE · DONE WHEN<\u002Fdiv>\n    <ul style=\"margin: 12px 0 0; padding-left: 20px; font-size: 14px; color: #2b3a30; line-height: 1.7;\">\n      <li>No role fill sits in the red (~25–40°) or green (~140°) hue ranges, and none collides with <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">--danger<\u002Fcode>.<\u002Fli>\n      <li>All five fills sit within a 0.56–0.66 lightness band; no role visibly outweighs the others on the court.<\u002Fli>\n      <li>Every adjacent pair stays distinguishable under deutan, protan, and tritan simulation — tested on the court <em>and<\u002Fem> on the unlabeled thumbnail.<\u002Fli>\n      <li>Palette is identical in light and dark themes (theme-independent, as before).<\u002Fli>\n      <li>White labels remain legible (large-text contrast ≥ 3:1) on every fill.<\u002Fli>\n      <li>The basic-mode recolour palette carries no red/green pair; its first two swatches are the most distinct pair.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <!-- ============================================================= -->\n  <!-- ITEM 06 -->\n  <!-- ============================================================= -->\n  <div style=\"margin-top: 72px; border-top: 2px solid #1d2129; padding-top: 8px;\"><\u002Fdiv>\n  <div style=\"margin-top: 28px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.24em; color: #2e7d4f;\">PART TWO<\u002Fdiv>\n  <h2 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.025em; margin: 8px 0 6px; line-height: 1.05;\">Two small fixes<\u002Fh2>\n  <p style=\"margin: 0 0 8px; color: #4a5260; font-size: 15.5px; max-width: 64ch;\">Both are token/rule changes in <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; background: rgba(20,24,32,0.06); padding: 1px 5px; border-radius: 4px;\">src/ui/styles.ts<\u002Fcode> and <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; background: rgba(20,24,32,0.06); padding: 1px 5px; border-radius: 4px;\">src/index.css<\u002Fcode>. No new components.<\u002Fp>\n\n  <!-- FIX 1 -->\n  <h3 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.015em; margin: 40px 0 6px;\">Fix 1 · Paired buttons should be the same height<\u002Fh3>\n  <p style=\"margin: 0 0 18px; color: #4a5260; font-size: 15px; max-width: 64ch;\">Quiet button variants (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">ghost<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">text<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">dashed<\u002Fcode>) are rendered one full scale-step smaller than the <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">primary<\u002Fcode> — smaller font <em>and<\u002Fem> less padding, so a shorter box. When a <strong>Cancel<\u002Fstrong> sits next to a <strong>Done / Save<\u002Fstrong>, the two don’t line up. It reads as a layout bug, not as hierarchy.<\u002Fp>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start;\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.18em; color: #9a4533;\">TODAY · QUIET IS A STEP SMALLER<\u002Fdiv>\n      <div style=\"background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 26px 30px; width: 300px; display: flex; align-items: center; justify-content: flex-end; gap: 12px;\">\n        <button style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #66707f; background: transparent; border: 1px solid rgba(20,24,32,0.14); border-radius: 8px; padding: 6px 10px; cursor: pointer;\">Cancel<\u002Fbutton>\n        <button style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: #fff; background: #2f6fe0; border: none; border-radius: 10px; padding: 8px 18px; cursor: pointer;\">Done<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin: 0; width: 300px; font-size: 12.5px; color: #9a4533; line-height: 1.45;\">Different heights and baselines — the eye reads misalignment first.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.18em; color: #2e7d4f;\">PROPOSED · MATCHED HEIGHT<\u002Fdiv>\n      <div style=\"background: #ffffff; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 26px 30px; width: 300px; display: flex; align-items: center; justify-content: flex-end; gap: 12px;\">\n        <button style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: #4a5260; background: transparent; border: 1px solid rgba(20,24,32,0.16); border-radius: 10px; padding: 8px 16px; cursor: pointer;\">Cancel<\u002Fbutton>\n        <button style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: #fff; background: #2f6fe0; border: none; border-radius: 10px; padding: 8px 18px; cursor: pointer;\">Done<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin: 0; width: 300px; font-size: 12.5px; color: #2e7d4f; line-height: 1.45;\">Same height, same font, same radius — hierarchy comes from fill vs. quiet, not size.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: 22px; background: #f4ede0; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 20px 26px;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #8a7d62;\">THE RULE<\u002Fdiv>\n    <p style=\"margin: 8px 0 0; font-size: 14px; color: #3a2f28;\">When a quiet button is paired with a primary in the same action row, the two must match on <strong>font size, vertical padding, and corner radius<\u002Fstrong> so their heights and text baselines align. The quiet button keeps its quiet <em>chrome<\u002Fem> (transparent or bordered, dim text); only its size is brought up to the primary. Its horizontal padding may stay slightly tighter, but height must match.<\u002Fp>\n    <p style=\"margin: 12px 0 0; font-size: 13px; color: #6a5f4e;\"><strong>Scope:<\u002Fstrong> applies to primary + secondary <em>pairs<\u002Fem> — form actions (Save / Cancel), the board editor’s Done / Cancel, and every confirm-dialog footer (confirm / cancel). A lone quiet button standing on its own (e.g. an inline text or dashed “add” affordance) may keep the smaller footprint.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- FIX 2 -->\n  <h3 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.015em; margin: 44px 0 6px;\">Fix 2 · The account menu — surface &amp; delete placement<\u002Fh3>\n  <p style=\"margin: 0 0 18px; color: #4a5260; font-size: 15px; max-width: 64ch;\">Two issues in one place. First, in light mode the menu looks <em>dingy<\u002Fem>. Second, “Delete account” sits one row below “Sign out” — an irreversible action a slip away from a routine one.<\u002Fp>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start;\">\n    <!-- current menu -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.18em; color: #9a4533;\">TODAY<\u002Fdiv>\n      <div style=\"background: #f1eee6; border: 1px solid rgba(20,24,32,0.12); border-radius: 14px; padding: 28px; display: flex; justify-content: center;\">\n        <div style=\"width: 210px; background: #e7e3d8; border: 1px solid rgba(20,24,32,0.1); border-radius: 10px; padding: 6px; box-shadow: 0 18px 40px -22px rgba(46,44,62,0.2); display: flex; flex-direction: column;\">\n          <div style=\"padding: 8px 10px 2px; font-size: 13px; font-weight: 700; color: #1d2129;\">Jan<\u002Fdiv>\n          <div style=\"padding: 0 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #66707f; border-bottom: 1px solid rgba(20,24,32,0.08);\">jan.corsten92@gmail.com<\u002Fdiv>\n          <div style=\"padding: 8px 10px; font-size: 12.5px; font-weight: 600; color: #1d2129; border-bottom: 1px solid rgba(20,24,32,0.08);\">Account settings<\u002Fdiv>\n          <div style=\"padding: 8px 10px; font-size: 12.5px; font-weight: 600; color: #1d2129; border-bottom: 1px solid rgba(20,24,32,0.08);\">Theme &nbsp; <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #97a0b1;\">[ ☉ ☾ ]<\u002Fspan><\u002Fdiv>\n          <div style=\"padding: 8px 10px; font-size: 12.5px; font-weight: 600; color: #1d2129;\">Sign out<\u002Fdiv>\n          <div style=\"padding: 8px 10px; font-size: 12.5px; font-weight: 600; color: #d6442b;\">Delete account<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 0; width: 266px; font-size: 12.5px; color: #9a4533; line-height: 1.45;\">The menu surface is <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px;\">--court-surface<\u002Fcode> (#e7e3d8) — darker than the page — so it reads grubby. Delete sits right under Sign out.<\u002Fp>\n    <\u002Fdiv>\n    <!-- proposed menu -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.18em; color: #2e7d4f;\">PROPOSED<\u002Fdiv>\n      <div style=\"background: #f1eee6; border: 1px solid rgba(20,24,32,0.12); border-radius: 14px; padding: 28px; display: flex; justify-content: center;\">\n        <div style=\"width: 210px; background: #fdfcf8; border: 1px solid rgba(20,24,32,0.1); border-radius: 10px; padding: 6px; box-shadow: 0 18px 40px -18px rgba(46,44,62,0.34); display: flex; flex-direction: column;\">\n          <div style=\"padding: 8px 10px 2px; font-size: 13px; font-weight: 700; color: #1d2129;\">Jan<\u002Fdiv>\n          <div style=\"padding: 0 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #66707f; border-bottom: 1px solid rgba(20,24,32,0.08);\">jan.corsten92@gmail.com<\u002Fdiv>\n          <div style=\"padding: 8px 10px; font-size: 12.5px; font-weight: 600; color: #1d2129; border-bottom: 1px solid rgba(20,24,32,0.08);\">Account settings<\u002Fdiv>\n          <div style=\"padding: 8px 10px; font-size: 12.5px; font-weight: 600; color: #1d2129; border-bottom: 1px solid rgba(20,24,32,0.08);\">Theme &nbsp; <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #97a0b1;\">[ ☉ ☾ ]<\u002Fspan><\u002Fdiv>\n          <div style=\"padding: 8px 10px; font-size: 12.5px; font-weight: 600; color: #1d2129;\">Sign out<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 0; width: 266px; font-size: 12.5px; color: #2e7d4f; line-height: 1.45;\">Overlay is the lightest surface on screen; destructive action removed from the menu entirely (now in Settings).<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: 22px; display: flex; flex-direction: column; gap: 16px;\">\n    <div style=\"background: #f4ede0; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 20px 26px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #8a7d62;\">FIX A · A REAL OVERLAY SURFACE<\u002Fdiv>\n      <p style=\"margin: 8px 0 0; font-size: 14px; color: #3a2f28;\">Floating overlays currently borrow <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">--court-surface<\u002Fcode> (the warm card <em>behind<\u002Fem> the court). In light mode that token (#e7e3d8) is darker than the page (#f1eee6), so menus look dingy; in dark mode it happens to read fine. Give overlays their own elevated token instead — the <strong>lightest<\u002Fstrong> surface in light mode (~<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">#fdfcf8<\u002Fcode>, lighter than the page) and a clearly <strong>lifted<\u002Fstrong> surface in dark mode (a step lighter than the dark <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">--bg<\u002Fcode>, not court-surface). Keep the existing <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">--shadow-overlay<\u002Fcode> and border.<\u002Fp>\n      <p style=\"margin: 10px 0 0; font-size: 13px; color: #6a5f4e;\"><strong>Scope:<\u002Fstrong> this is the shared overlay surface — the fix lands on <em>every<\u002Fem> dropdown, submenu, listbox, and combobox popup, not just the avatar menu. Verify them all in light mode.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #f4ede0; border: 1px solid rgba(20,24,32,0.12); border-radius: 12px; padding: 20px 26px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #8a7d62;\">FIX B · DEMOTE “DELETE ACCOUNT”<\u002Fdiv>\n      <p style=\"margin: 8px 0 0; font-size: 14px; color: #3a2f28;\">Remove “Delete account” from the avatar menu and move it to the <strong>Account settings page<\u002Fstrong> as a clearly bounded destructive action, keeping the existing confirmation dialog (the strong, danger-styled confirm already exists). The avatar menu then ends on the routine <strong>Sign out<\u002Fstrong>. Update the settings-page intent copy, which currently states delete lives in the avatar menu.<\u002Fp>\n      <p style=\"margin: 10px 0 0; font-size: 13px; color: #6a5f4e;\">Rationale: an irreversible account deletion should take deliberate navigation, not sit one mis-tap below the everyday “Sign out.”<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ACCEPTANCE 06 -->\n  <div style=\"margin-top: 32px; background: #eef3ee; border: 1px solid rgba(46,125,79,0.3); border-radius: 12px; padding: 22px 28px;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #2e7d4f;\">PART TWO · DONE WHEN<\u002Fdiv>\n    <ul style=\"margin: 12px 0 0; padding-left: 20px; font-size: 14px; color: #2b3a30; line-height: 1.7;\">\n      <li>In any primary + secondary action pair, both buttons share height, font size, and radius; baselines align.<\u002Fli>\n      <li>Lone/standalone quiet buttons are unaffected (no global bloat).<\u002Fli>\n      <li>Every menu, listbox, and combobox popup sits on the new overlay surface and reads as the lightest layer in light mode.<\u002Fli>\n      <li>The dark-mode overlay still reads as a lifted surface (no regression).<\u002Fli>\n      <li>“Delete account” no longer appears in the avatar menu; it lives in Settings behind its existing confirm dialog.<\u002Fli>\n      <li>Settings-page copy no longer references the avatar menu for deletion.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"margin-top: 56px; border-top: 1px solid rgba(20,24,32,0.14); padding-top: 20px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #97917f;\">\n    <span>VOLLEYCOACH · DESIGN SPEC<\u002Fspan>\n    <span>VALUES VERIFIED AGAINST 23-DESIGN-UPDATE<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
