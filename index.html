<!-- HTML entry point: loads fonts, sets the theme before paint, and mounts the React app. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>VolleyCoach</title>
    <!-- Link preview: one app-wide brand card for every link (the SPA shares a single card). See docs/brand.md. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://volleycoach.pages.dev/" />
    <meta property="og:title" content="VolleyCoach" />
    <meta property="og:description" content="Build, organise, and animate volleyball tactics and drills." />
    <meta property="og:image" content="https://volleycoach.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VolleyCoach" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (or preferred) theme before first paint to avoid a flash of the wrong one.
      (function () {
        var saved = localStorage.getItem("volleycoach-theme");
        var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = saved || (prefersLight ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
